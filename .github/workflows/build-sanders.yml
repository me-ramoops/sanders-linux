name: Build Sanders kernel
# Build automatically when the Sanders branch changes.

on:
  push:
    branches:
      - sanders
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -yqq && sudo apt-get install -yqq bc bison flex libelf-dev libssl-dev clang llvm lld python3 gzip

      - name: Configure
        run: |
          make ARCH=arm64 LLVM=1 defconfig
          scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/msm8953.config arch/arm64/configs/motorola-potter.config
          ./scripts/config --module CONFIG_DRM_PANEL_MOTOROLA_SANDERS_TIANMA_NT35596
          ./scripts/config --module CONFIG_DRM_PANEL_MOTOROLA_SANDERS_DJN_ILI7807D
          ./scripts/config --module CONFIG_DRM_MSM
          ./scripts/config --module CONFIG_TOUCHSCREEN_EDT_FT5X06
          ./scripts/config --module CONFIG_RMI4_CORE
          ./scripts/config --module CONFIG_RMI4_I2C
          ./scripts/config --enable CONFIG_RMI4_F11
          ./scripts/config --enable CONFIG_RMI4_F12
          ./scripts/config --module CONFIG_USB_LIBCOMPOSITE
          ./scripts/config --module CONFIG_USB_F_RNDIS
          ./scripts/config --enable CONFIG_USB_CONFIGFS_RNDIS
          ./scripts/config --enable CONFIG_FB_SIMPLE
          ./scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          ./scripts/config --enable CONFIG_VT
          make ARCH=arm64 LLVM=1 olddefconfig

      - name: Build kernel
        run: make ARCH=arm64 LLVM=1 -j"$(nproc)" Image.gz dtbs modules

      - name: Verify Sanders outputs
        run: |
          test -f arch/arm64/boot/Image.gz
          test -f arch/arm64/boot/dts/qcom/msm8953-motorola-sanders.dtb
          test -f drivers/gpu/drm/panel/panel-motorola-sanders-tianma-nt35596.ko
          test -f drivers/gpu/drm/panel/panel-motorola-sanders-djn-ili7807d.ko

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sanders-kernel
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/qcom/msm8953-motorola-sanders.dtb
            drivers/gpu/drm/panel/panel-motorola-sanders-*.ko
